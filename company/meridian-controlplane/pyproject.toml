[project]
name = "meridian-controlplane"
version = "0.6.0"
description = "Meridian control plane: monitor policy and coverage reconciliation, deploy rollout, CI merge gates, identity/RBAC config, scaffold config."
requires-python = ">=3.12,<3.13"
dependencies = ["meridian-common", "fastapi>=0.115", "pydantic>=2.13.5", "pyyaml>=6.0", "uvicorn>=0.54.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian_controlplane"]
