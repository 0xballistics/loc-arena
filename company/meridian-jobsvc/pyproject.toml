[project]
name = "meridian-jobsvc"
version = "0.8.0"
description = "Meridian cluster and job orchestration: jobs run as processes on a fleet of nodes, with a job queue, scheduler, autoscaler, worker runtime, node lifecycle, ledger, spec DSL."
requires-python = ">=3.12,<3.13"
dependencies = [
  "meridian-common",
  "croniter>=6.2.4",
  "fastapi>=0.115",
  "mcp>=2.3.0",
  "pydantic>=2.13.5",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian_jobsvc"]
